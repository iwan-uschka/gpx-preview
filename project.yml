name: GPXPreview

options:
  bundleIdPrefix: io.github.iwan-uschka
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Every Info.plist and .entitlements file is hand-written. XcodeGen's `info:`
# and `entitlements:` keys are never used here because they regenerate (and
# overwrite) those files; the build settings below only point at them.
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Manual
    # Ad-hoc signing, no paid developer account. scripts/build.sh re-signs
    # the finished bundle inside-out with each target's entitlements.
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0.0.0"

targets:

  # Host app: ships both extensions, declares the GPX content type (import
  # only) and shows install guidance.
  GPXPreview:
    type: application
    platform: macOS
    sources:
      - path: Sources/Host
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iwan-uschka.GPXPreview
        # No space on purpose: a space in the bundle folder name crashes
        # PlugInKit's extension bootstrap. CFBundleDisplayName keeps "GPX Preview".
        PRODUCT_NAME: GPXPreview
        INFOPLIST_FILE: Sources/Host/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Host/Host.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: GPXQuickLook
      - target: GPXThumbnail

  # Spacebar preview. Sandboxed (required for registration), no network.
  GPXQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLook
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iwan-uschka.GPXPreview.QuickLook
        PRODUCT_NAME: GPXQuickLook
        INFOPLIST_FILE: Sources/QuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/QuickLook/QuickLook.entitlements
        WRAPPER_EXTENSION: appex

  # Finder thumbnail. Sandboxed, no network, ever.
  GPXThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Thumbnail
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iwan-uschka.GPXPreview.Thumbnail
        PRODUCT_NAME: GPXThumbnail
        INFOPLIST_FILE: Sources/Thumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Thumbnail/Thumbnail.entitlements
        WRAPPER_EXTENSION: appex

  # Plain XCTest over Sources/Shared, compiled in directly so the bundle needs
  # no host app, extension, signing or network.
  GPXPreviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        type: folder
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iwan-uschka.GPXPreview.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GPXPreview:
    build:
      # The app and extensions are left out of the `test` action: building
      # them for tests leaves a full .app in DerivedData, which LaunchServices
      # auto-registers as a second copy of the installed extensions.
      targets:
        GPXPreview: [run, profile, analyze, archive]
        GPXQuickLook: [run, profile, analyze, archive]
        GPXThumbnail: [run, profile, analyze, archive]
        GPXPreviewTests: [test]
    run:
      config: Release
    test:
      targets: [GPXPreviewTests]
